[package]
name = "dex-analysis"
version = "0.1.0"
edition = "2024"

[dependencies]
daachorse = { git = "https://github.com/HydraDragonAntivirus/daachorse.git", branch = "main" }
dex-core = { path = "../dex-core" }
once_cell = "1.20"
petgraph = "0.6"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = "0.6"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
