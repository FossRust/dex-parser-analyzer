[package]
name = "dex-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.5"
nom = { version = "7.1", default-features = false, features = ["std"] }
once_cell = "1.19"
petgraph = { version = "0.6", features = ["serde-1"] }
serde = { version = "1.0", features = ["derive"] }
simd_cesu8 = "0.2"
smallvec = "1.13"
thiserror = "1.0"

[dev-dependencies]
serde_json = "1.0"
